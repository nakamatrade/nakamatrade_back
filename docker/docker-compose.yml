version: '3'
services:
  postgres:
    image: postgres:16
    container_name: postgre-container
    restart: always
    volumes:
      - ./postgres-production-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql             # 초기화 SQL 스크립트 마운트
      #- ./init-config.sh:/docker-entrypoint-initdb.d/init-config.sh # 초기화 쉘 스크립트 마운트
    ports:
      - "15432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: rhksflwk1!
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: redis-container
    ports:
      - "16379:6379"
    command: redis-server --requirepass "nakamatrade1!" --protected-mode no